name: CI/CD Testing & Quality Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vivelite_user
          POSTGRES_PASSWORD: ci_test_password_2026
          POSTGRES_DB: vivelite_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vivelite_user -d vivelite_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Generate & Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://vivelite_user:ci_test_password_2026@localhost:5433/vivelite_db?schema=public
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm prisma:seed

      - name: Build Backend
        working-directory: ./backend
        run: pnpm build

      - name: Start Backend API for Integration & E2E Suites
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://vivelite_user:ci_test_password_2026@localhost:5433/vivelite_db?schema=public
          JWT_ACCESS_SECRET: ci-secret-key-12345-access-token-min32chars
          JWT_REFRESH_SECRET: ci-secret-key-12345-refresh-token-min32chars
          JWT_SECRET: ci-secret-key-12345
          PORT: 4000
          API_PREFIX: api/v1
        run: |
          node dist/main.js &
          echo "Esperando que el backend esté listo en http://127.0.0.1:4000/api/v1/health..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4000/api/v1/health | grep -q "ok"; then
              echo "Backend API activo y respondiendo exitosamente en el puerto 4000!"
              break
            fi
            echo "Esperando backend ($i/30)..."
            sleep 1
          done

      - name: Run Backend Unit & Integration Tests with Coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://vivelite_user:ci_test_password_2026@localhost:5433/vivelite_db?schema=public
          JWT_ACCESS_SECRET: ci-secret-key-12345-access-token-min32chars
          JWT_REFRESH_SECRET: ci-secret-key-12345-refresh-token-min32chars
          JWT_SECRET: ci-secret-key-12345
          API_URL: http://127.0.0.1:4000/api/v1
        run: pnpm test:all:cov

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend-tests:
    name: Frontend Tests & Responsive Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Suite (Unit, Component, Responsive)
        working-directory: ./frontend
        run: pnpm test:cov

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
