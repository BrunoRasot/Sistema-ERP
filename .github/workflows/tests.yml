name: CI/CD Testing & Quality Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vivelite_user
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password_2026' }}
          POSTGRES_DB: vivelite_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Generate & Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://vivelite_user:ci_test_password_2026@localhost:5433/vivelite_db?schema=public' }}
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate deploy
          pnpm prisma:seed

      - name: Run Backend Unit & Integration Tests with Coverage
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://vivelite_user:ci_test_password_2026@localhost:5433/vivelite_db?schema=public' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-secret-key-12345' }}
        run: pnpm test:all:cov

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend-tests:
    name: Frontend Tests & Responsive Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Suite (Unit, Component, Responsive)
        working-directory: ./frontend
        run: pnpm test:cov

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
